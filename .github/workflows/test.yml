name: Travel checks
on:
  push:
    paths: ['index.html', 'worker.mjs', 'taxi/**', 'server/**', 'api/**', 'tests/**', 'package.json', '.github/workflows/test.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check taxi/app.js
      - run: node --check worker.mjs
      - run: node --check server/edge-handler.mjs
      - run: node --test tests/*.test.js
